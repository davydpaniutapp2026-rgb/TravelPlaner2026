<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPlanner — Плануйте свою подорож</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-wrapper">
    <header class="navbar">
      <a href="#" class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
        </svg>
        <span>TravelPlanner</span>
      </a>

      <nav class="nav-links">
        <a href="#" class="nav-link active">Головна</a>
        <a href="#" class="nav-link">Місця</a>
      </nav>
    </header>

    <main class="main-content">
      <div class="hero-header">
        <svg class="pin-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
        </svg>
        <div>
          <h1 class="hero-title">Плануйте свою подорож</h1>
          <p class="hero-subtitle">Оберіть параметри, щоб знайти ідеальну подорож</p>
        </div>
      </div>

      <section class="planner-card">
        <form id="tripForm" class="planner-form">
          <div class="form-row row-three">
            <div class="field-group">
              <label for="citySelect" class="field-label">
                <svg class="label-icon" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M15 11V5l-3-3-3 3v2H3v14h18V11h-6zm-8 8H5v-2h2v2zm0-4H5v-2h2v2zm0-4H5V9h2v2zm6 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V9h2v2zm0-4h-2V5h2v2zm6 12h-2v-2h2v2zm0-4h-2v-2h2v2z"/>
                </svg>
                <span>Місто</span>
              </label>
              <div class="select-wrapper">
                <select id="citySelect" name="city" class="pill-control" required>
                  <option value="" disabled selected>Оберіть місто</option>
                </select>
              </div>
            </div>

            <div class="field-group">
              <label for="daysSelect" class="field-label">
                <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span>Днів (1-7)</span>
              </label>
              <div class="select-wrapper">
                <select id="daysSelect" name="days" class="pill-control" required>
                  <option value="" disabled selected>Оберіть кількість днів</option>
                  <option value="1">1 день</option>
                  <option value="2">2 дні</option>
                  <option value="3">3 дні</option>
                  <option value="4">4 дні</option>
                  <option value="5">5 днів</option>
                  <option value="6">6 днів</option>
                  <option value="7">7 днів</option>
                </select>
              </div>
            </div>

            <div class="field-group">
              <label for="budgetInput" class="field-label">
                <svg class="label-icon" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M21 7H5a2 2 0 0 1 0-4h14v2H5v.01h16V7zm0 2H3a1 1 0 0 0-1 1v9a2 2 0 0 0 2 2h17a1 1 0 0 0 1-1v-10a1 1 0 0 0-1-1zm-3 7a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/>
                </svg>
                <span>Бюджет</span>
              </label>
              <input
                type="number"
                id="budgetInput"
                name="budget"
                class="pill-control"
                placeholder="Вкажіть бюджет"
                min="1"
                step="any"
                required
              />
            </div>
          </div>

          <div class="form-row row-three">
            <!-- Осіб (1-10) -->
            <div class="field-group">
              <label for="peopleSelect" class="field-label">
                <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>Осіб (1-10)</span>
              </label>
              <div class="select-wrapper">
                <select id="peopleSelect" name="people" class="pill-control" required>
                  <option value="" disabled selected>Кількість людей</option>
                  <option value="1">1 особа</option>
                  <option value="2">2 особи</option>
                  <option value="3">3 особи</option>
                  <option value="4">4 особи</option>
                  <option value="5">5 осіб</option>
                  <option value="6">6 осіб</option>
                  <option value="7">7 осіб</option>
                  <option value="8">8 осіб</option>
                  <option value="9">9 осіб</option>
                  <option value="10">10 осіб</option>
                </select>
              </div>
            </div>

            <div class="field-group">
              <label for="levelSelect" class="field-label">
                <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
                <span>Комфорт</span>
              </label>
              <div class="select-wrapper">
                <select id="levelSelect" name="level" class="pill-control" required>
                  <option value="economy" selected>Економ</option>
                  <option value="comfort">Комфорт</option>
                </select>
              </div>
            </div>

            <div class="field-group">
              <label for="currencySelect" class="field-label">
                <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="12" y1="1" x2="12" y2="23"></line>
                  <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
                <span>Валюта</span>
              </label>
              <div class="select-wrapper">
                <select id="currencySelect" name="currency" class="pill-control" required>
                  <option value="EUR" selected>EUR (€)</option>
                  <option value="USD">USD ($)</option>
                  <option value="UAH">UAH (₴)</option>
                </select>
              </div>
            </div>
          </div>

          <hr class="divider" />

          <div class="vacation-type-section">
            <div class="type-pills" role="group" aria-label="Тип відпочинку">
  <!-- Культура -->
  <label class="type-pill">
    <input type="checkbox" name="vacationType" value="culture" />
    <span>
      <svg class="pill-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2 2 7v2h20V7L12 2zm-7 9v7H3v2h18v-2h-2v-7h-2v7h-4v-7h-2v7H7v-7H5z"/>
      </svg>
      Культура
    </span>
  </label>

  <!-- Активний -->
  <label class="type-pill">
    <input type="checkbox" name="vacationType" value="active" />
    <span>
      <svg class="pill-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9 1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1l-5.2 2.2v4.7h2v-3.4l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"/>
      </svg>
      Активний
    </span>
  </label>

  <!-- Гастрономія -->
  <label class="type-pill">
    <input type="checkbox" name="vacationType" value="food" />
    <span>
      <svg class="pill-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/>
      </svg>
      Гастрономія
    </span>
  </label>
</div>
          </div>

          <div class="submit-wrapper">
            <button type="submit" class="btn-submit">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <span>Створити план</span>
            </button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <!-- Прихований блок результатів: вартість та маршрут -->
<section id="resultSection" class="result-card hidden" aria-live="polite">
  
  <!-- Блок витрат -->
  <div class="cost-list">
    <div class="cost-row">
      <div class="cost-label">
        <svg class="cost-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm12-6h-8v7H3V5H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4z"/>
        </svg>
        <span>Проживання</span>
      </div>
      <span class="price-badge" id="accommodationCost">Ціна Валюта</span>
    </div>

    <div class="cost-row">
      <div class="cost-label">
        <svg class="cost-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/>
        </svg>
        <span>Їжа</span>
      </div>
      <span class="price-badge" id="foodCost">Ціна Валюта</span>
    </div>

    <div class="cost-row">
      <div class="cost-label">
        <svg class="cost-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 6c0-1.5 2.5-2 7-2s7 .5 7 2v5H5V6z"/>
        </svg>
        <span>Транспорт</span>
      </div>
      <span class="price-badge" id="transportCost">Ціна Валюта</span>
    </div>

    <div class="cost-row">
      <div class="cost-label">
        <svg class="cost-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M22 10V6a2 2 0 0 0-2-2H4c-1.1 0-1.99.9-1.99 2v4c1.1 0 1.99.9 1.99 2s-.89 2-2 2v4c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-4c-1.1 0-2-.9-2-2s.9-2 2-2zm-9 7.5h-2v-2h2v2zm0-4.5h-2v-2h2v2zm0-4.5h-2v-2h2v2z"/>
        </svg>
        <span>Квитки</span>
      </div>
      <span class="price-badge" id="ticketsCost">Ціна Валюта</span>
    </div>

    <div class="cost-row">
      <div class="cost-label">
        <svg class="cost-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 10h3l-4 4-4-4h3V7h2v5z"/>
        </svg>
        <span>Разом</span>
      </div>
      <span class="price-badge" id="totalCost">Ціна Валюта</span>
    </div>
  </div>

  <div class="level-compare" id="levelCompare"></div>

  <div class="balance-bar" id="balanceBar">
    <svg class="balance-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M21 7H5a2 2 0 0 1 0-4h14v2H5v.01h16V7zm0 2H3a1 1 0 0 0-1 1v9a2 2 0 0 0 2 2h17a1 1 0 0 0 1-1v-10a1 1 0 0 0-1-1zm-3 7a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/>
    </svg>
    <span>Залишок бюджету: <span id="remainingBudget">ціна Валюта</span></span>
  </div>

  <!-- Маршрут -->
  <div class="itinerary-section">
    <div class="itinerary-header">
      <!-- Стилізована іконка книги/маршруту -->
      <svg class="map-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
      </svg>
      <h2>Маршрут</h2>
    </div>

    <div id="itineraryList" class="itinerary-list">
      <!-- Картки днів генеруватимуться динамічно через JS -->
    </div>
  </div>
</section>

  <script src="js/data.js"></script>
  <script src="js/calculateCost.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
